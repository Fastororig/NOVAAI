name: Build Nova AI APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: false

      - name: Generate Gradle Wrapper
        run: |
          TARGET_DIR="."
          if [ -d "android" ] && [ -f "android/settings.gradle.kts" ]; then
            TARGET_DIR="android"
          fi
          echo "Android project directory: $TARGET_DIR"
          cd "$TARGET_DIR"

          # Generate clean Gradle wrapper with binary JAR
          echo "Generating Gradle wrapper files..."
          gradle wrapper --gradle-version 8.7 --distribution-type bin

          # Set executable permissions
          chmod +x gradlew

          echo "Wrapper verification:"
          ls -la gradlew gradle/wrapper/

      - name: Build APK with Gradle
        run: |
          TARGET_DIR="."
          if [ -d "android" ] && [ -f "android/settings.gradle.kts" ]; then
            TARGET_DIR="android"
          fi
          cd "$TARGET_DIR"

          # Run build using wrapper, with automatic fallback to installed gradle
          if [ -f "./gradlew" ] && [ -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Building with ./gradlew assembleDebug..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Falling back to system gradle assembleDebug..."
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaAI-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
